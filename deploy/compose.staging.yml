# STAGING ONLY. The mysql/redis/kafka/zipkin infrastructure must be provisioned separately.
# Stage secrets are loaded from /opt/food-delivery/staging.env (never committed).
# Runtime images are immutable Jenkins-verified Git SHA tags. No build on deployment host.
name: food-delivery-staging
networks:
  food-platform:
    external: true
    name: food-platform
services:
  discovery-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-discovery-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_INSTANCE_HOSTNAME: discovery-service
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: 'true'
  api-gateway:
    image: ghcr.io/lokeshpusarla100/food-delivery-api-gateway:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    ports:
      - "127.0.0.1:${GATEWAY_BIND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
  user-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-user-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME:?Required USER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?Required USER_DB_PASSWORD}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?Required USER_JWT_SECRET}
      USER_INTERNAL_API_KEY: ${USER_INTERNAL_API_KEY:?Required USER_INTERNAL_API_KEY}
  restaurant-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-restaurant-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/restaurant_db
      SPRING_DATASOURCE_USERNAME: ${RESTAURANT_DB_USERNAME:?Required RESTAURANT_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RESTAURANT_DB_PASSWORD:?Required RESTAURANT_DB_PASSWORD}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?Required USER_JWT_SECRET}
      RESTAURANT_INTERNAL_API_KEY: ${RESTAURANT_INTERNAL_API_KEY:?Required RESTAURANT_INTERNAL_API_KEY}
      RESTAURANT_PLATFORM_ADMIN_KEY: ${RESTAURANT_PLATFORM_ADMIN_KEY:?Required RESTAURANT_PLATFORM_ADMIN_KEY}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      RESTAURANT_OUTBOX_ENABLED: ${RESTAURANT_OUTBOX_ENABLED:-false}
  order-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-order-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USERNAME:?Required ORDER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:?Required ORDER_DB_PASSWORD}
      USER_INTERNAL_API_KEY: ${USER_INTERNAL_API_KEY:?Required USER_INTERNAL_API_KEY}
  payment-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-payment-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USERNAME:?Required PAYMENT_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:?Required PAYMENT_DB_PASSWORD}
  delivery-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-delivery-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/delivery_db
      SPRING_DATASOURCE_USERNAME: ${DELIVERY_DB_USERNAME:?Required DELIVERY_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DELIVERY_DB_PASSWORD:?Required DELIVERY_DB_PASSWORD}
  notification-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-notification-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USERNAME:?Required NOTIFICATION_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Required NOTIFICATION_DB_PASSWORD}
  fleet-management-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-fleet-management-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fleet_db
      SPRING_DATASOURCE_USERNAME: ${FLEET_DB_USERNAME:?Required FLEET_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${FLEET_DB_PASSWORD:?Required FLEET_DB_PASSWORD}
  feedback-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-feedback-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/feedback_db
      SPRING_DATASOURCE_USERNAME: ${FEEDBACK_DB_USERNAME:?Required FEEDBACK_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${FEEDBACK_DB_PASSWORD:?Required FEEDBACK_DB_PASSWORD}
  analytics-service:
    image: ghcr.io/lokeshpusarla100/food-delivery-analytics-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - food-platform
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/analytics_db
      SPRING_DATASOURCE_USERNAME: ${ANALYTICS_DB_USERNAME:?Required ANALYTICS_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Required ANALYTICS_DB_PASSWORD}
