spring:
  application:
    name: restaurant-service
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: ${RESTAURANT_DB_POOL_MAX:15}
      minimum-idle: ${RESTAURANT_DB_POOL_MIN:2}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
security:
  jwt:
    secret: ${USER_JWT_SECRET:}
    issuer: ${USER_JWT_ISSUER:food-delivery-user-service}
    audience: ${USER_JWT_AUDIENCE:food-delivery-api}
  restaurant:
    platform-key: ${RESTAURANT_PLATFORM_ADMIN_KEY:}
    internal-key: ${RESTAURANT_INTERNAL_API_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  shutdown: graceful
logging:
  level:
    com.fooddelivery: INFO
    org.springframework.security: WARN
