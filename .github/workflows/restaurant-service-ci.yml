name: Restaurant Service CI
on:
  pull_request:
    paths: ['restaurant-service/**','commons/**','pom.xml','.github/workflows/restaurant-service-ci.yml']
  push:
    branches: [main,feat/restaurant-service-production-foundation]
    paths: ['restaurant-service/**','commons/**','pom.xml','.github/workflows/restaurant-service-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and MySQL integration tests
        run: mvn -B -ntp -pl restaurant-service -am verify
